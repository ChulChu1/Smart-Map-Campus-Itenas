<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/L.Control.Locate.min.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet-search.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <link rel="stylesheet" href="css/leaflet-measure.css">
    <title>Smart Map Campus Itenas</title>
    <style>
    :root {
        --bg:       #0f0d0a;
        --panel:    #1a1410;
        --card:     #231c14;
        --hover:    #2e2318;
        --accent:   #f97316;
        --glow:     rgba(249,115,22,0.3);
        --green:    #fb923c;
        --border:   rgba(255,200,100,0.07);
        --borderLt: rgba(255,200,100,0.15);
        --txt:      #f5ede3;
        --muted:    #a8947e;
        --dim:      #5a4a38;
        --shadow:   0 8px 32px rgba(0,0,0,0.5);
        --r:        10px;
        --rs:       7px;
        --fd:       'Syne', sans-serif;
        --fb:       'DM Sans', sans-serif;
        --sw:       300px;
        --hh:       60px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:var(--bg);font-family:var(--fb);color:var(--txt);overflow:hidden}

    #app{display:flex;flex-direction:column;width:100%;height:100%}

    /* HEADER */
    #hdr{
        height:var(--hh);flex-shrink:0;
        background:var(--panel);border-bottom:1px solid var(--border);
        display:flex;align-items:center;padding:0 18px;gap:14px;
        z-index:1100;
        animation:sdn .5s ease both;
    }
    @keyframes sdn{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
    .hlogo{
        height:34px;flex-shrink:0;
        display:flex;align-items:center;justify-content:center;
    }
    .hlogo img{
        height:34px;width:auto;
    }
    .htitle h1{font-family:var(--fd);font-size:14px;font-weight:700;letter-spacing:.2px;line-height:1.2}
    .htitle p{font-size:11px;color:var(--muted);font-weight:300;letter-spacing:.3px}
    .hbadge{
        margin-left:auto;
        background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.3);
        color:var(--accent);font-size:9.5px;font-weight:600;
        padding:3px 10px;border-radius:100px;letter-spacing:.8px;text-transform:uppercase;
        animation:pbadge 3s ease infinite;
    }
    @keyframes pbadge{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.35)}50%{box-shadow:0 0 0 4px rgba(249,115,22,0)}}
    .hbtn{
        width:34px;height:34px;border-radius:var(--rs);
        background:var(--card);border:1px solid var(--border);
        color:var(--muted);cursor:pointer;
        display:flex;align-items:center;justify-content:center;font-size:13px;
        transition:all .2s;
    }
    .hbtn:hover{background:var(--hover);border-color:var(--borderLt);color:var(--txt)}

    /* BODY */
    #body{flex:1;display:flex;overflow:hidden;position:relative}

    /* SIDEBAR */
    #sb{
        width:var(--sw);height:100%;flex-shrink:0;
        background:var(--panel);border-right:1px solid var(--border);
        display:flex;flex-direction:column;z-index:1050;
        transition:transform .3s cubic-bezier(.4,0,.2,1);
        animation:sbl .5s .1s ease both;
    }
    #sb.off{transform:translateX(calc(-1 * var(--sw)))}
    @keyframes sbl{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
    .sb-search{padding:14px;border-bottom:1px solid var(--border)}
    .srch-wrap{position:relative}
    .srch-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:11px;pointer-events:none}
    #fsearch{
        width:100%;background:var(--card);border:1px solid var(--border);
        border-radius:var(--rs);padding:8px 11px 8px 32px;
        color:var(--txt);font-family:var(--fb);font-size:12.5px;outline:none;
        transition:border-color .2s,box-shadow .2s;
    }
    #fsearch::placeholder{color:var(--dim)}
    #fsearch:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
    .sb-sec{padding:12px 14px 6px}
    .sb-lbl{font-size:9.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px}

    .bm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .bm-btn{
        background:var(--card);border:1px solid var(--border);border-radius:var(--rs);
        padding:9px 5px;cursor:pointer;text-align:center;
        transition:all .2s;color:var(--muted);font-size:10.5px;font-family:var(--fb);
    }
    .bm-btn:hover{background:var(--hover);border-color:var(--borderLt);color:var(--txt)}
    .bm-btn.on{background:rgba(59,130,246,.12);border-color:var(--accent);color:var(--accent)}
    .bm-btn i{display:block;font-size:16px;margin-bottom:4px}

    .sb-layers{flex:1;overflow-y:auto;padding:0 14px 14px}
    .sb-layers::-webkit-scrollbar{width:3px}
    .sb-layers::-webkit-scrollbar-thumb{background:var(--borderLt);border-radius:2px}
    .lyr-item{
        display:flex;align-items:center;gap:9px;
        padding:7px 9px;border-radius:var(--rs);cursor:pointer;
        transition:background .15s;font-size:12px;color:var(--txt);margin-bottom:1px;
    }
    .lyr-item:hover{background:var(--hover)}
    .lyr-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;border:1px solid rgba(255,255,255,.18)}

    .sb-stats{padding:11px 14px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .st-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:9px 6px;text-align:center}
    .st-num{font-family:var(--fd);font-size:17px;font-weight:700;color:var(--accent);line-height:1}
    .st-lbl{font-size:9px;color:var(--dim);margin-top:3px;letter-spacing:.3px}

    /* MAP */
    #mapwrap{flex:1;position:relative;overflow:hidden}
    #map{width:100%;height:100%}

    #sbtoggle{
        position:absolute;top:14px;left:14px;z-index:1060;
        width:36px;height:36px;background:var(--panel);
        border:1px solid var(--borderLt);border-radius:var(--rs);
        display:none;align-items:center;justify-content:center;
        color:var(--txt);cursor:pointer;font-size:13px;
        box-shadow:var(--shadow);transition:all .2s;
    }
    #sbtoggle:hover{background:var(--hover)}

    /* CUSTOM MAP CONTROLS */
    #mctrl{
        position:absolute;top:14px;right:14px;z-index:1000;
        display:flex;flex-direction:column;gap:5px;
        animation:fin .6s .3s both;
    }
    @keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .mbtn{
        width:36px;height:36px;background:var(--panel);
        border:1px solid var(--borderLt);border-radius:var(--rs);
        display:flex;align-items:center;justify-content:center;
        color:var(--txt);cursor:pointer;font-size:13px;
        box-shadow:var(--shadow);transition:all .2s;position:relative;
    }
    .mbtn:hover{background:var(--hover);border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px var(--glow),var(--shadow)}
    .mbtn.on{background:rgba(59,130,246,.15);border-color:var(--accent);color:var(--accent)}
    .mbtn-div{height:1px;background:var(--border);margin:1px 3px}
    .mtt{
        position:absolute;right:42px;top:50%;transform:translateY(-50%);
        background:var(--card);border:1px solid var(--borderLt);
        color:var(--txt);font-size:11px;padding:5px 9px;
        border-radius:var(--rs);white-space:nowrap;
        pointer-events:none;opacity:0;transition:opacity .15s;
        font-family:var(--fb);box-shadow:var(--shadow);
    }
    .mbtn:hover .mtt{opacity:1}

    /* LEAFLET OVERRIDES */
    .leaflet-top.leaflet-left,.leaflet-bottom.leaflet-left{display:none!important}
    .leaflet-control-attribution{
        background:var(--panel)!important;color:var(--dim)!important;
        border-top:1px solid var(--border)!important;font-size:9px!important;
        font-family:var(--fb)!important;
    }
    .leaflet-control-attribution a{color:var(--muted)!important}
    .leaflet-control-scale-line{
        background:var(--panel)!important;border:1px solid var(--borderLt)!important;
        border-top:2px solid var(--accent)!important;color:var(--muted)!important;
        font-family:var(--fb)!important;font-size:10px!important;
        padding:2px 6px!important;border-radius:0 0 var(--rs) var(--rs)!important;
    }
    .leaflet-popup-content-wrapper{
        background:var(--panel)!important;border:1px solid var(--borderLt)!important;
        border-radius:var(--r)!important;box-shadow:0 20px 60px rgba(0,0,0,.6)!important;
        color:var(--txt)!important;font-family:var(--fb)!important;
        padding:0!important;overflow:hidden;
    }
    .leaflet-popup-content{margin:0!important}
    .leaflet-popup-tip{background:var(--panel)!important}
    .leaflet-popup-content table{width:100%;border-collapse:collapse}
    .leaflet-popup-content table tr:first-child td,
    .leaflet-popup-content table th{
        background:var(--card);color:var(--dim);font-size:9.5px;
        letter-spacing:.8px;text-transform:uppercase;
        padding:9px 13px 7px;font-weight:600;font-family:var(--fd);
    }
    .leaflet-popup-content table td{
        padding:9px 13px;font-size:13px;color:var(--txt);font-weight:500;
    }
    .leaflet-popup-close-button{color:var(--muted)!important;font-size:17px!important;top:6px!important;right:7px!important}
    .leaflet-popup-close-button:hover{color:var(--txt)!important}

    /* COORDS */
    #coords{
        position:absolute;bottom:14px;right:14px;z-index:1000;
        background:var(--panel);border:1px solid var(--border);
        border-radius:var(--rs);padding:5px 11px;
        font-size:10.5px;color:var(--muted);
        font-family:'Courier New',monospace;pointer-events:none;
        animation:fin .6s .5s both;
    }
    #coords span{color:var(--accent)}

    /* LOADING */
    #ld{
        position:fixed;inset:0;background:var(--bg);z-index:9999;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
        animation:lout .4s 1.3s both;pointer-events:none;
    }
    @keyframes lout{to{opacity:0;visibility:hidden}}
    .ld-logo{
        height:56px;display:flex;align-items:center;justify-content:center;
        animation:lspin .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    .ld-logo img{
        height:56px;width:auto;
    }
    @keyframes lspin{from{transform:rotate(-180deg) scale(0);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
    .ld-txt{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--txt);letter-spacing:1px}
    .ld-bar{width:150px;height:2px;background:var(--border);border-radius:1px;overflow:hidden}
    .ld-fill{height:100%;background:linear-gradient(90deg,var(--accent),#fbbf24);animation:lbar 1.1s ease both}
    @keyframes lbar{from{width:0}to{width:100%}}
    </style>
</head>
<body>

<div id="ld">
    <div class="ld-logo"><img src="logo-itenas.png" alt="Logo Itenas"></div>
    <div class="ld-txt">Smart Map Campus</div>
    <div class="ld-bar"><div class="ld-fill"></div></div>
</div>

<div id="app">
    <header id="hdr">
        <div class="hlogo"><img src="logo-itenas.png" alt="Logo Itenas"></div>
        <div class="htitle">
            <h1>Smart Map Campus Itenas</h1>
            <p>Institut Teknologi Nasional Bandung</p>
        </div>
        <div class="hbadge">Live</div>
        <button class="hbtn" id="hdr-toggle" title="Toggle Sidebar"><i class="fas fa-bars"></i></button>
    </header>

    <div id="body">
        <aside id="sb">
            <div class="sb-search">
                <div class="srch-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="fsearch" placeholder="Cari gedung atau fasilitas...">
                </div>
            </div>
            <div class="sb-sec">
                <div class="sb-lbl">Basemap</div>
                <div class="bm-grid">
                    <button class="bm-btn on" data-bm="osm"><i class="fas fa-map"></i>OSM</button>
                    <button class="bm-btn" data-bm="gmap"><i class="fas fa-road"></i>Google</button>
                    <button class="bm-btn" data-bm="gsat"><i class="fas fa-satellite"></i>Satelit</button>
                </div>
            </div>
            <div class="sb-sec">
                <div class="sb-lbl">Legenda</div>
            </div>
            <div class="sb-layers" id="legend"></div>
            <div class="sb-stats">
                <div class="st-card"><div class="st-num" id="s1">-</div><div class="st-lbl">Gedung</div></div>
                <div class="st-card"><div class="st-num" id="s2">-</div><div class="st-lbl">Lab</div></div>
                <div class="st-card"><div class="st-num" id="s3">-</div><div class="st-lbl">Fasilitas</div></div>
            </div>
        </aside>

        <div id="mapwrap">
            <button id="sbtoggle"><i class="fas fa-bars"></i></button>
            <div id="map"></div>
            <div id="mctrl">
                <button class="mbtn" id="bzin"><i class="fas fa-plus"></i><span class="mtt">Perbesar</span></button>
                <button class="mbtn" id="bzout"><i class="fas fa-minus"></i><span class="mtt">Perkecil</span></button>
                <div class="mbtn-div"></div>
                <button class="mbtn" id="bloc"><i class="fas fa-location-arrow"></i><span class="mtt">Lokasi Saya</span></button>
                <button class="mbtn" id="bhome"><i class="fas fa-home"></i><span class="mtt">Ke Kampus</span></button>
                <div class="mbtn-div"></div>
                <button class="mbtn" id="bfs"><i class="fas fa-expand"></i><span class="mtt">Layar Penuh</span></button>
            </div>
            <div id="coords"><span id="clat">-</span>, <span id="clng">-</span></div>
        </div>
    </div>
</div>

<script src="js/qgis2web_expressions.js"></script>
<script src="js/leaflet.js"></script>
<script src="js/L.Control.Layers.Tree.min.js"></script>
<script src="js/L.Control.Locate.min.js"></script>
<script src="js/leaflet.rotatedMarker.js"></script>
<script src="js/leaflet.pattern.js"></script>
<script src="js/leaflet-hash.js"></script>
<script src="js/Autolinker.min.js"></script>
<script src="js/rbush.min.js"></script>
<script src="js/labelgun.min.js"></script>
<script src="js/labels.js"></script>
<script src="js/leaflet.photon.js"></script>
<script src="js/leaflet-measure.js"></script>
<script src="js/proj4.js"></script>
<script src="js/proj4leaflet.js"></script>
<script src="js/leaflet-search.js"></script>
<script src="data/ITENAS_1.js"></script>
<script>
var autolinker = new Autolinker({truncate:{length:30,location:'smart'}});

function cleanPopup(content, feature) {
    var d = document.createElement('div'); d.innerHTML = content;
    d.querySelectorAll('tr').forEach(function(r){
        var td = r.querySelector('td.visible-with-data');
        if(td && feature.properties[td.id]==null) r.remove();
    });
    return d.innerHTML;
}

var campusBounds = [[-6.8988743830177945,107.63330136749292],[-6.894491132035334,107.6416681151115]];

var map = L.map('map', {
    crs: L.CRS.EPSG3857,
    zoomControl: false,
    maxZoom: 28, minZoom: 1,
    attributionControl: true
}).fitBounds(campusBounds);

map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
L.control.scale({position:'bottomright',imperial:false}).addTo(map);

var bms = {
    osm:  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxNativeZoom:19,maxZoom:28}),
    gmap: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{attribution:'© Google',maxNativeZoom:21,maxZoom:28}),
    gsat: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{attribution:'© Google Satellite',maxNativeZoom:21,maxZoom:28})
};
bms.osm.addTo(map);
var curBm = 'osm';

var colors = {
    'ATM BNI':'rgba(227,203,132,1)','Fotocopy':'rgba(217,16,93,1)',
    'Gedung Arsitektur':'rgba(230,125,150,1)','Gedung Cafetaria':'rgba(203,88,96,1)',
    'Gedung Desain':'rgba(57,200,232,1)','Gedung Fakultas':'rgba(70,226,153,1)',
    'Gedung Informatika':'rgba(195,137,229,1)',
    'Gedung Perencanaan Wilayah dan Kota (PWK)':'rgba(37,101,230,1)',
    'Gedung Perpustakaan':'rgba(122,103,229,1)','Gedung Rektorat':'rgba(123,223,193,1)',
    'Gedung Serba Guna':'rgba(200,81,41,1)','Gedung Student Center':'rgba(201,102,156,1)',
    'Gedung Teknik Elektro':'rgba(93,203,135,1)','Gedung Teknik Geodesi':'rgba(125,188,222,1)',
    'Gedung Teknik Industri':'rgba(191,200,96,1)','Gedung Teknik Kimia':'rgba(235,220,50,1)',
    'Gedung Teknik Lingkungan':'rgba(111,238,240,1)','Gedung Teknik Mesin':'rgba(208,27,187,1)',
    'Gedung Teknik Sipil':'rgba(216,135,126,1)','Klinik Itenas':'rgba(17,205,180,1)',
    'Lab. Bahasa Inggris':'rgba(54,224,91,1)','Lab. Desain Interior':'rgba(39,136,232,1)',
    'Lab. Desain Produk':'rgba(34,64,213,1)','Lab. Fisika Dasar':'rgba(207,232,133,1)',
    'Lab. Teknik Mesin':'rgba(92,227,98,1)','Lab. Teknik Sipil':'rgba(141,97,237,1)',
    'Lap. Basket':'rgba(225,176,102,1)','Lap. Tenis':'rgba(200,60,205,1)',
    'Lap. Voli':'rgba(125,125,205,1)','Masjid Itenas':'rgba(112,208,38,1)',
    'Pos Satpam':'rgba(151,224,41,1)','Ruang Arsip Fakultas':'rgba(220,155,106,1)',
    'Ruang Kuliah Umum':'rgba(227,45,175,1)','Ruang Perlengkapan':'rgba(175,18,214,1)',
    'Ruang Studio TA DI DKV':'rgba(141,71,217,1)','Tribun':'rgba(143,216,117,1)'
};

map.createPane('pane_ITENAS_1');
map.getPane('pane_ITENAS_1').style.zIndex = 401;

var layer_ITENAS_1 = new L.geoJson(json_ITENAS_1, {
    pane:'pane_ITENAS_1',
    interactive:true,
    style: function(f){
        return {
            pane:'pane_ITENAS_1',
            opacity:1, color:'rgba(255,255,255,0.55)',
            lineCap:'round', lineJoin:'round', weight:1.5,
            fill:true, fillOpacity:0.82,
            fillColor: colors[f.properties['Nama']] || 'rgba(150,150,150,1)',
            interactive:true
        };
    },
    onEachFeature: function(feature, layer) {
        var nama = feature.properties['Nama'] || '';
        var popup = '<table><tr><th scope="row">Nama Lokasi</th></tr>' +
            '<tr><td class="visible-with-data" id="Nama">' +
            (nama ? autolinker.link(String(nama).replace(/'/g,"'").toLocaleString()) : '') +
            '</td></tr></table>';
        var content = cleanPopup(popup, feature);
        layer.bindPopup(content, {maxHeight:400, offset:[0,-4]});
        layer.on('mouseover', function(){
            layer.setStyle({weight:3, color:'#fff', fillOpacity:1});
            layer.openPopup();
        });
        layer.on('mouseout', function(){
            layer_ITENAS_1.resetStyle(layer);
            layer.closePopup();
        });
    }
});
map.addLayer(layer_ITENAS_1);

// Build legend
var legendEl = document.getElementById('legend');
var fsearch = document.getElementById('fsearch');
function buildLegend(q) {
    legendEl.innerHTML = '';
    Object.keys(colors).forEach(function(n){
        if(q && !n.toLowerCase().includes(q.toLowerCase())) return;
        var item = document.createElement('div'); item.className = 'lyr-item';
        var dot  = document.createElement('div'); dot.className = 'lyr-dot';
        dot.style.background = colors[n];
        var lbl  = document.createElement('span'); lbl.textContent = n;
        item.appendChild(dot); item.appendChild(lbl);
        item.addEventListener('click', function(){
            layer_ITENAS_1.eachLayer(function(l){
                if(l.feature && l.feature.properties && l.feature.properties['Nama']===n){
                    map.fitBounds(l.getBounds().pad(0.6));
                    l.openPopup();
                }
            });
        });
        legendEl.appendChild(item);
    });
}
buildLegend('');
fsearch.addEventListener('input', function(){ buildLegend(this.value); });

// Stats
var g=0, l=0, f=0;
Object.keys(colors).forEach(function(n){
    if(n.startsWith('Gedung')) g++;
    else if(n.startsWith('Lab.')) l++;
    else f++;
});
document.getElementById('s1').textContent = g;
document.getElementById('s2').textContent = l;
document.getElementById('s3').textContent = f;

// Basemap buttons
document.querySelectorAll('.bm-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
        var bm = this.dataset.bm;
        if(bm === curBm) return;
        map.removeLayer(bms[curBm]);
        map.addLayer(bms[bm]);
        curBm = bm;
        document.querySelectorAll('.bm-btn').forEach(function(b){ b.classList.remove('on'); });
        this.classList.add('on');
    });
});

// Map buttons
document.getElementById('bzin').addEventListener('click', function(){ map.zoomIn(); });
document.getElementById('bzout').addEventListener('click', function(){ map.zoomOut(); });
document.getElementById('bhome').addEventListener('click', function(){ map.fitBounds(campusBounds); });
document.getElementById('bloc').addEventListener('click', function(){
    var btn = this;
    btn.classList.add('on');
    map.locate({setView:true, maxZoom:19, enableHighAccuracy:true});
    map.once('locationfound', function(e){
        L.circleMarker(e.latlng,{radius:8,color:'#f97316',fillColor:'#f97316',fillOpacity:.9,weight:2})
            .addTo(map).bindPopup('<b>Lokasi Anda</b>').openPopup();
        setTimeout(function(){ btn.classList.remove('on'); }, 2000);
    });
    map.once('locationerror', function(){
        alert('Tidak dapat menemukan lokasi Anda.');
        btn.classList.remove('on');
    });
});

var isFs = false;
document.getElementById('bfs').addEventListener('click', function(){
    if(!isFs){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); this.querySelector('i').className='fas fa-compress'; }
    else { document.exitFullscreen&&document.exitFullscreen(); this.querySelector('i').className='fas fa-expand'; }
    isFs = !isFs;
});

// Sidebar toggle
var sb = document.getElementById('sb');
var sbt = document.getElementById('sbtoggle');
function toggleSb(){
    sb.classList.toggle('off');
    sbt.style.display = sb.classList.contains('off') ? 'flex' : 'none';
    setTimeout(function(){ map.invalidateSize(); }, 320);
}
document.getElementById('hdr-toggle').addEventListener('click', toggleSb);
sbt.addEventListener('click', toggleSb);

// Coordinates
map.on('mousemove', function(e){
    document.getElementById('clat').textContent = e.latlng.lat.toFixed(6);
    document.getElementById('clng').textContent = e.latlng.lng.toFixed(6);
});

var hash = new L.Hash(map);
</script>
</body>
</html>
